    <style>
         /* ──────────────────────────────────────────────────────────────
      WORKATO BRAND PALETTE (official — from BrandColors_RGB.ai)
      Hero Teal #67EADD · Dark Teal #21DBC8 · Dark Blue #083763
      Royal Blue #1D60CA · Medium Blue #2FD4FF · Orange Creamsicle #FC9867
      Red #F00000 (used sparingly/semantically only)
      ────────────────────────────────────────────────────────────── */
         :root {
           --teal: #67eadd;
           --teal-dark: #21dbc8;
           --dark-blue: #0e2c50;
           --deep-blue: #062845;
           --card-blue: #0c4070;
           --card-blue-soft: rgba(255, 255, 255, 0.05);
           --card-line: rgba(255, 255, 255, 0.13);
           --orange: #fc9867;
           --orange-deep: #ff5506;
           --pink: #ef80e3;
           --lilac: #c3a9ff;
           --gold: #ffca00;
           --red: #f00000;
           --ink-soft: #c9ddef;
           --ink-faint: #9fc4dd;
           --font-display: "Besley", Georgia, serif;
           --font-body:
             "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
             sans-serif;
           /* standard Wolf2 breakpoint/grid system — see breakpoints-and-grid.md */
           --max-w: 1438px;
         }
         /* Desktop 1440+: 1438 · Responsive 1150-1439: 1140 · Compact 960-1149: 946 · Tablet/Mobile <960: fluid */
         @media (max-width: 1439px) {
           :root {
             --max-w: 1140px;
           }
         }
         @media (max-width: 1149px) {
           :root {
             --max-w: 946px;
           }
         }
         @media (max-width: 959px) {
           :root {
             --max-w: 100%;
           }
         }

         * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
         }
         html {
           scroll-behavior: smooth;
         }
         body {
           font-family: var(--font-body);
           background: var(--dark-blue);
           color: #fff;
           line-height: 1.5;
           -webkit-font-smoothing: antialiased;
         }
         .container {
           max-width: var(--max-w);
           margin: 0 auto;
           padding: 0 24px;
         }

         h1,
         h2 {
           font-family: var(--font-display);
           font-weight: 600;
           letter-spacing: -0.01em;
         }
         h3 {
           font-family: var(--font-body);
           font-weight: 600;
         }

         /* NAV — the divider line lives on the full-width wrapper so it spans edge
      to edge, while nav itself stays aligned to the standard container width */
         .nav-band {
           border-bottom: 1px solid var(--teal);
         }
         nav {
           display: flex;
           align-items: center;
           justify-content: space-between;
           padding: 32px 0 24px;
         }
         nav .wk-logo {
           height: 22px;
           width: auto;
           display: block;
         }

         /* HERO BAND — full-bleed Vegas skyline artwork behind the page title. The
      box always sits near the top (align-items:flex-start) rather than
      toggling to centered at a breakpoint — no jump. Padding and
      background-size are both fluid (clamp/calc against viewport width)
      instead of switching between two fixed states, so there's a smooth
      transition through the in-between "small tablet" widths instead of a
      snap at one exact pixel.
        background-size: exactly 125% (of band width) below ~480px, tapers
      linearly down to exactly 100% at ~960px and holds there — so the crop
      amount "scales out" gradually as the viewport widens, bottoming out at
      no crop once there's enough room, same end states as before, just no
      longer a hard switch. */
         .hero-band {
           position: relative;
           min-height: 50vh;
           display: flex;
           align-items: flex-start;
           justify-content: center;
           overflow: hidden;
           background-color: var(--dark-blue);
           background-image: url("src/hero-vegas-blue-fill.svg");
           background-repeat: no-repeat;
           background-position: center bottom;
           background-size: clamp(100vw, calc(75vw + 240px), 125vw) auto;
           padding: clamp(32px, 6vw, 64px) clamp(20px, 5vw, 48px)
             clamp(32px, 6vw, 64px);
         }

         /* Outer frame + inner box give a double-stroke picture-frame look — two
      concentric rings with a solid dark-blue fill in the gap between them
      (a plain outline can't be filled, since it paints over whatever sits
      behind the box, so this uses two real nested boxes instead). */
         .hero-box-frame {
           position: relative;
           max-width: 764px;
           width: 100%;
           margin: 0 auto;
           background: var(--dark-blue);
           border: 2px solid var(--gold);
           border-radius: 18px;
           padding: 22px;
           box-shadow:
             0 0 12px rgba(255, 202, 0, 0.6),
             0 0 26px rgba(255, 202, 0, 0.3);
         }
         /* Dewy sits just right of the hero text box, standing in the
      foreground at the bottom of the hero band — pinned low enough that
      .hero-band's overflow:hidden crops off its bottom ~5%, like it's
      planted right at the edge of frame. The source gif (dewy-hero-bonk.gif)
      is pre-cropped to its actual character bounds with a small margin, so
      the bottom offset only needs to cover that margin plus the ~5% crop
      (no more guessing past a huge transparent canvas). Positioned relative
      to .hero-band (not the box) so it pins to the whole hero, not just the
      box frame; the box is centered and capped at 764px wide once Dewy is
      shown, so its right edge is a fixed calc() from band center. Only
      shown once the hero band is wide enough that Dewy's width + gap fits
      beside the (max-width) box without overflowing the band. */
         .hero-dewy {
           display: none;
           position: absolute;
           left: calc(50% + 382px + 24px);
           bottom: -29px;
           width: 200px;
           height: auto;
           pointer-events: none;
         }
         /* A real element (not a border) so it paints in its own stacking
      layer above the background artwork AND above Dewy, instead of sitting
      behind Dewy where a plain border-bottom on .hero-band would land. */
         .hero-bottom-stroke {
           position: absolute;
           left: 0;
           right: 0;
           bottom: 0;
           height: 2px;
           background: var(--teal);
           z-index: 5;
           pointer-events: none;
         }
         /* Desktop + Responsive (1150px+): Dewy stands beside the box, per
      the left calc() above — that formula always starts 24px clear of the
      frame's right edge, so it structurally can't overlap the box/text no
      matter how the gap beside the box shrinks as the viewport narrows. */
         @media (min-width: 1150px) {
           .hero-dewy {
             display: block;
           }
         }
         /* Compact and Mobile (<1150px): the box is close to (or exactly)
      full-width here, so there's no side gap left to stand in — move Dewy
      below/center instead of beside the box. The extra band padding-bottom
      below carves out standing room so Dewy's full height clears the box's
      bottom edge instead of overlapping the text/buttons. */
         @media (max-width: 1149px) {
           .hero-band {
             padding-bottom: 220px;
           }
           .hero-dewy {
             display: block;
             left: 50%;
             transform: translateX(-50%);
           }
         }
         /* Marching-ants border — chasing dashes around the perimeter, like a
      theater/marquee sign. Border is transparent (kept only to hold the box
      model's spacing); the dashes are 4 repeating-linear-gradient layers,
      one per edge, each animated by shifting background-position one dash
      cycle (20px) in the clockwise direction. */
         .hero-box {
           position: relative;
           background-color: var(--dark-blue);
           border: 3px solid transparent;
           border-radius: 14px;
           padding: 28px 24px;
           text-align: center;
           background-image:
             repeating-linear-gradient(
               to right,
               var(--lilac) 0 10px,
               transparent 10px 20px
             ),
             repeating-linear-gradient(
               to bottom,
               var(--lilac) 0 10px,
               transparent 10px 20px
             ),
             repeating-linear-gradient(
               to right,
               var(--lilac) 0 10px,
               transparent 10px 20px
             ),
             repeating-linear-gradient(
               to bottom,
               var(--lilac) 0 10px,
               transparent 10px 20px
             );
           background-position:
             0 0,
             100% 0,
             0 100%,
             0 0;
           background-size:
             20px 3px,
             3px 20px,
             20px 3px,
             3px 20px;
           background-repeat: repeat-x, repeat-y, repeat-x, repeat-y;
           animation: heroBoxAnts 1s linear infinite;
         }
         @keyframes heroBoxAnts {
           to {
             background-position:
               20px 0,
               100% 20px,
               -20px 100%,
               0 -20px;
           }
         }
         @media (prefers-reduced-motion: reduce) {
           .hero-box {
             animation: none;
           }
         }
         .hero-wow-logo {
           height: 120px;
           width: auto;
           display: block;
           margin: 0 auto 14px;
         }
         .hero-box h1 {
           font-family: var(--font-body);
           font-weight: 800;
           text-transform: uppercase;
           letter-spacing: 0.01em;
           font-size: clamp(28px, 5vw, 40px);
           line-height: 1.2;
           margin-bottom: 12px;
         }
         .hero-box .sub {
           font-size: 18px;
           color: var(--ink-soft);
           max-width: 480px;
           margin: 0 auto;
         }

         /* Location tag — small Vegas nod at the bottom of the box */
         .loc-tag {
           display: inline-flex;
           align-items: center;
           gap: 6px;
           font-size: 13px;
           font-weight: 700;
           letter-spacing: 0.04em;
           text-transform: uppercase;
           color: var(--orange);
           margin-top: 16px;
         }
         .loc-tag svg {
           width: 14px;
           height: 14px;
           flex-shrink: 0;
         }
         .hero-ctas {
           display: flex;
           justify-content: center;
           flex-wrap: wrap;
           gap: 12px;
           margin-top: 22px;
         }
         .hero-btn {
           display: inline-flex;
           align-items: center;
           gap: 8px;
           font-family: var(--font-body);
           font-size: 15px;
           font-weight: 700;
           letter-spacing: 0.04em;
           text-transform: uppercase;
           text-decoration: none;
           color: var(--dark-blue);
           background: var(--teal);
           border: none;
           border-radius: 8px;
           padding: 10px 20px;
           cursor: pointer;
           transition: background 0.15s ease, transform 0.15s ease;
           white-space: nowrap;
         }
         .hero-btn:hover {
           background: var(--teal-dark);
           transform: translateY(-2px);
         }
         .hero-btn svg {
           width: 20px;
           height: 20px;
           flex-shrink: 0;
         }

         @media (max-width: 640px) {
           /* Fixed px min-height (not vh) on small screens — mobile browsers size
        vh against the viewport with the address bar collapsed, so vh renders
        taller than what's actually visible on load. 600px ≈ 3/4 of a
        typical ~800px mobile screen height. This is a floor, not a cap —
        if the box's content needs more room than that, the band grows to
        keep it fully contained rather than letting it overflow. Box
        padding/logo size are just a modest cosmetic reduction, not part of
        the fluid system above. */
           .hero-band {
             min-height: 600px;
           }
           .hero-box {
             padding: 20px 16px;
           }
           .hero-wow-logo {
             height: 64px;
           }
         }

         /* Section headings — plain H2s, Figtree (sans) rather than the Besley
      serif used elsewhere, no eyebrow labels */
         .section-h2 {
           font-family: var(--font-body);
           font-weight: 600;
           font-size: clamp(24px, 2.8vw, 32px);
           letter-spacing: -0.01em;
           margin-bottom: 20px;
         }

         .agenda-section {
           padding-top: 56px;
           padding-bottom: 72px;
         }

         /* "Builder Sessions" — neon-sign treatment: caps, wide letter-spacing,
      framed in a glowing orange border. Sits on its own line above the
      featured card and day filters (not sharing a row with anything). */
         .neon-heading {
           display: inline-flex;
           align-items: center;
           gap: 10px;
           font-weight: 800;
           text-transform: uppercase;
           letter-spacing: 0.08em;
           border: 2px solid var(--orange);
           border-radius: 10px;
           padding: 6px 16px;
           box-shadow:
             0 0 12px rgba(252, 152, 103, 0.6),
             0 0 26px rgba(252, 152, 103, 0.3);
         }
         .neon-heading svg {
           width: 34px;
           height: 34px;
           color: var(--orange);
           flex-shrink: 0;
         }

         /* Sub-headers — smaller than "Builder Sessions", no frame, used to
      introduce the featured card ("Up Next"/"Happening Now") and the
      filterable grid ("Browse Sessions"). Same treatment for both. */
         .sub-header {
           font-family: var(--font-body);
           font-weight: 700;
           font-size: 20px;
           letter-spacing: 0.06em;
           text-transform: uppercase;
           color: var(--pink);
           margin: 32px 0 22px;
         }
         .sub-header-row {
           display: flex;
           align-items: center;
           justify-content: space-between;
           flex-wrap: wrap;
           gap: 16px;
           margin: 32px 0 28px;
         }
         .sub-header-row .sub-header {
           margin: 0;
         }
         #featSubHeader {
           font-size: 24px;
         }
         .sub-header-row .day-tabs {
           margin-bottom: 0;
         }

         /* Featured "Up Next" card sits between the heading and the day filters,
      outside the filterable grid, so switching days never hides it. */
         #featSlot {
           margin-bottom: 28px;
         }

         /* DAY TABS — simple filter for the agenda grid below */
         .day-tabs {
           display: flex;
           gap: 10px;
           margin-bottom: 28px;
           flex-wrap: wrap;
         }
         .tab {
           font-family: var(--font-body);
           font-weight: 700;
           font-size: 14px;
           color: var(--ink-faint);
           background: transparent;
           border: 1px solid var(--card-line);
           border-radius: 999px;
           padding: 9px 18px;
           cursor: pointer;
           transition:
             background 0.15s ease,
             color 0.15s ease,
             border-color 0.15s ease;
         }
         .tab:hover {
           border-color: rgba(239, 128, 227, 0.5);
           color: #fff;
         }
         .tab.active {
           background: var(--pink);
           color: var(--dark-blue);
           border-color: var(--pink);
         }
         /* Each day gets its own accent color; "All" cycles through all three,
      like a sign flipping between them, since it represents all of them. */
         .tab.active[data-day="Tuesday Sep 22"] {
           background: var(--pink);
           border-color: var(--pink);
         }
         .tab.active[data-day="Wednesday Sep 23"] {
           background: var(--orange);
           border-color: var(--orange);
         }
         .tab.active[data-day="Thursday Sep 24"] {
           background: var(--gold);
           border-color: var(--gold);
         }
         .tab.active[data-day="all"] {
           animation: allDaysCycle 3s steps(1) infinite;
         }
         @keyframes allDaysCycle {
           0% {
             background: var(--pink);
             border-color: var(--pink);
           }
           34% {
             background: var(--orange);
             border-color: var(--orange);
           }
           67% {
             background: var(--gold);
             border-color: var(--gold);
           }
         }
         @media (prefers-reduced-motion: reduce) {
           .tab.active[data-day="all"] {
             animation: none;
             background: var(--pink);
             border-color: var(--pink);
           }
         }
         .tab:disabled {
           opacity: 0.4;
           cursor: not-allowed;
         }
         .tab:disabled:hover {
           border-color: var(--card-line);
           color: var(--ink-faint);
         }

         /* CARD GRID — 3 cols desktop/responsive, 2 compact, 1 mobile (see breakpoints-and-grid.md) */
         .card-grid {
           display: grid;
           grid-template-columns: repeat(3, 1fr);
           gap: 24px;
         }
         @media (max-width: 1149px) {
           .card-grid {
             grid-template-columns: repeat(2, 1fr);
           }
         }
         @media (max-width: 959px) {
           .card-grid {
             grid-template-columns: 1fr;
           }
         }

         /* GET INVOLVED grid — 4 across on desktop/responsive, 2x2 on
      compact, 1x4 (stacked) on mobile */
         .card-grid.involved-grid {
           grid-template-columns: repeat(3, 1fr);
         }
         @media (max-width: 1149px) {
           .card-grid.involved-grid {
             grid-template-columns: repeat(2, 1fr);
           }
         }
         @media (max-width: 959px) {
           .card-grid.involved-grid {
             grid-template-columns: 1fr;
           }
         }

         /* Subtle motion — cards fade/slide in as they render, with a light
      stagger across the first few, then lift slightly on hover. */
         @keyframes fadeInUp {
           from {
             opacity: 0;
             transform: translateY(10px);
           }
           to {
             opacity: 1;
             transform: translateY(0);
           }
         }
         .card-grid > *:nth-child(1) {
           animation-delay: 0s;
         }
         .card-grid > *:nth-child(2) {
           animation-delay: 0.05s;
         }
         .card-grid > *:nth-child(3) {
           animation-delay: 0.1s;
         }
         .card-grid > *:nth-child(4) {
           animation-delay: 0.15s;
         }
         .card-grid > *:nth-child(5) {
           animation-delay: 0.2s;
         }
         .card-grid > *:nth-child(6) {
           animation-delay: 0.25s;
         }
         .hero-box-frame {
           animation: fadeInUp 0.6s ease both;
         }
         @media (prefers-reduced-motion: reduce) {
           .s-card,
           .res-card,
           .hero-box-frame {
             animation: none;
           }
           .s-card:hover,
           .res-card:hover {
             transform: none;
           }
         }

         /* SESSION CARD (grid) */
         .s-card {
           position: relative;
           display: flex;
           flex-direction: column;
           background: var(--card-blue-soft);
           border: 1px solid var(--card-line);
           border-radius: 14px;
           padding: 22px 24px;
           transition:
             border-color 0.15s ease,
             transform 0.2s ease,
             box-shadow 0.2s ease;
           animation: fadeInUp 0.5s ease both;
         }
         .s-card:hover {
           border-color: var(--pink);
           transform: translateY(-3px);
           box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
         }
         .s-card-time {
           font-size: calc(11px + 0.4vw);
           font-weight: 700;
           letter-spacing: 0.04em;
           color: var(--ink-faint);
           text-transform: uppercase;
           margin-bottom: 8px;
         }
         .s-card-topic {
           font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
           font-size: 12px;
           font-weight: 600;
           color: var(--orange);
           opacity: 0.85;
           margin-bottom: 8px;
         }
         .s-card h3 {
           font-size: 19px;
           line-height: 1.3;
           color: #fff;
           margin-bottom: 10px;
         }
         .s-card-desc {
           font-size: 14px;
           color: var(--ink-faint);
           line-height: 1.5;
           margin-bottom: 16px;
         }
         .s-card-speakers {
           display: flex;
           flex-direction: column;
           gap: 10px;
           margin-top: auto;
           padding-top: 14px;
         }
         .s-mini {
           display: flex;
           align-items: center;
           gap: 10px;
         }
         .s-mini .s-name {
           font-size: 13px;
           font-weight: 700;
           color: #fff;
           line-height: 1.3;
         }
         .s-mini .s-role {
           font-size: 13px;
           color: var(--ink-faint);
           line-height: 1.3;
         }

         /* NEXT EVENT — the soonest upcoming (or currently live) session, called out
      with a Vegas-marquee-style blinking neon border wherever it lands in the
      grid (naturally top-left, since the grid is sorted chronologically).
      It also spans the full grid row, with a wide two-column layout inside
      (content left, larger speaker portraits off to the right) instead of
      the compact stacked layout the regular narrower cards use. */
         .s-card-featured {
           padding: 48px 52px;
         }
         .s-card-featured-inner {
           display: flex;
           align-items: flex-start;
           justify-content: space-between;
           gap: 28px;
           flex-wrap: wrap;
         }
         .s-card-main {
           flex: 1;
           min-width: 240px;
         }
         .s-card-featured h3 {
           max-width: 640px;
           font-size: 26px;
         }
         .s-card-featured .s-card-desc {
           font-size: 16px;
           line-height: 1.6;
           max-width: 640px;
         }
         .speakers-row {
           display: flex;
           gap: 26px;
           flex-shrink: 0;
           flex-wrap: wrap;
         }
         .speaker-col {
           display: flex;
           flex-direction: column;
           align-items: center;
           text-align: center;
           width: 170px;
         }
         .speaker-col .s-name {
           font-size: 15px;
           font-weight: 700;
           color: #fff;
           line-height: 1.3;
           margin-top: 14px;
         }
         .speaker-col .s-role {
           font-size: 15px;
           color: var(--ink-faint);
           line-height: 1.3;
         }
         .s-card-featured {
           grid-column: 1/-1;
           border-width: 2px;
           border-color: var(--pink);
           box-shadow: 0 0 14px rgba(239, 128, 227, 0.6);
         }

         .avatar {
           display: flex;
           align-items: center;
           justify-content: center;
           font-family: var(--font-display);
           font-weight: 700;
           color: var(--dark-blue);
           flex-shrink: 0;
           border-radius: 50%;
           overflow: hidden;
         }
         .avatar img {
           width: 100%;
           height: 100%;
           object-fit: cover;
           display: block;
         }
         /* Placeholder-speaker avatar (no photo yet) — Dewy mascot art on a soft
      tint circle, contained (not cropped) since the art isn't a full-bleed
      square photo like the real headshots. */
         .avatar-placeholder {
           background: #ede6ff;
         }
         .avatar-placeholder img {
           width: 72%;

            X: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
            Facebook:
              '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 8.7 8.7 0 0 0-.5-.016 4.65 4.65 0 0 0-1.098.128 1.878 1.878 0 0 0-.803.398c-.221.207-.375.474-.457.797-.101.481-.145.973-.13 1.464v1.2h3.507l-.577 3.667h-2.93v7.98H9.101z"/></svg>',
            GitHub:
              '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>',
          };

          let gridSessionsAll = [];
          let currentFilter = "all";
          let featuredId = null;
          let featuredIsLive = false;
          let eventOver = false; // true once nothing is upcoming — disables day filters
          

          function resolveNow() {
            
            return new Date();
          }

          function avatarHtml(sp, size) {
            if (sp.photo) {
              return `<div class="avatar" style="width:${size}px;height:${size}px;"><img src="${escAttr(sp.photo)}" alt="${escAttr(sp.name)}"></div>`;
            }
            return `<div class="avatar avatar-placeholder" style="width:${size}px;height:${size}px;"><img src="src/dewy-avatar-placeholder.png" alt="Speaker photo coming soon"></div>`;
          }

          function roleLine(sp) {
            return [sp.role, sp.company].filter(Boolean).map(escHtml).join(", ");
          }

          function speakersMiniHtml(speakers) {
            return `<div class="s-card-speakers">${speakers
              .map(
                (sp) => `
        <div class="s-mini">
          ${avatarHtml(sp, 80)}
          <div><div class="s-name">${escHtml(sp.name)}</div><div class="s-role">${roleLine(sp)}</div></div>
        </div>`,
              )
              .join("")}</div>`;
          }

          function speakersRowHtml(speakers) {
            return `<div class="speakers-row">${speakers
              .map(
                (sp) => `
        <div class="speaker-col">
          ${avatarHtml(sp, 130)}
          <span class="s-name">${escHtml(sp.name)}</span>
          <span class="s-role">${sp.role ? escHtml(sp.role) + "<br>" : ""}${escHtml(sp.company)}</span>
        </div>`,
              )
              .join("")}</div>`;
          }

          function hasLink(s) {
            return !!s.url && s.url !== "#" && isSafeUrl(s.url);
          }

          function sessionCardHtml(s, showDay, inGrid = false) {
            const timeLine = showDay
              ? `${escHtml(s.dayShort)} · ${escHtml(s.timeLabel)}`
              : escHtml(s.timeLabel);
            const isFeatured = s.id === featuredId && !inGrid;
            const topicHtml = s.topic
              ? `<div class="s-card-topic">// ${escHtml(s.topic.toLowerCase())}</div>`
              : "";
            const descHtml = s.desc ? `<p class="s-card-desc">${escHtml(s.desc)}</p>` : "";
            const linkHtml = hasLink(s)
              ? `<a href="${escAttr(s.url)}" class="text-link">Learn more ${CHEVRON_SVG}</a>`
              : "";

            if (isFeatured) {
              return `<div class="s-card s-card-featured">
          <div class="s-card-featured-inner">
            <div class="s-card-main">
              ${topicHtml}
              <div class="s-card-time">${timeLine}</div>
              <h3>${escHtml(s.title)}</h3>
              ${descHtml}
              ${linkHtml}
            </div>
            ${s.speakers.length ? speakersRowHtml(s.speakers) : ""}
          </div>
        </div>`;
            }

            return `<div class="s-card">
        ${topicHtml}
        <div class="s-card-time">${timeLine}</div>
        <h3>${escHtml(s.title)}</h3>
        ${descHtml}
        ${s.speakers.length ? speakersMiniHtml(s.speakers) : ""}
        ${linkHtml}
      </div>`;
          }

          function pastCardHtml(s) {
            const topicHtml = s.topic
              ? `<div class="s-card-topic">// ${escHtml(s.topic.toLowerCase())}</div>`
              : "";
            const descHtml = s.desc ? `<p class="s-card-desc">${escHtml(s.desc)}</p>` : "";
            const linkHtml = hasLink(s)
              ? `<a href="${escAttr(s.url)}" class="text-link">Watch recording ${CHEVRON_SVG}</a>`
              : "";
            return `<div class="s-card s-card-past">
        <div class="video-slot">${PLAY_SVG}<span>Recording coming soon</span></div>
        ${topicHtml}
        <div class="s-card-time">${escHtml(s.day)} · ${escHtml(s.timeLabel)}</div>
        <h3>${escHtml(s.title)}</h3>
        ${descHtml}
        ${s.speakers.length ? speakersMiniHtml(s.speakers) : ""}
        ${linkHtml}
      </div>`;
          }

          function renderGrid() {
            if (eventOver) {
              // Everything's over — the grid just becomes the full past-sessions
              // list (day filters are disabled, so there's nothing to narrow by).
              document.getElementById("agendaGrid").innerHTML = gridSessionsAll
                .map(pastCardHtml)
                .join("");
              return;
            }
            const list =
              currentFilter === "all"
                ? gridSessionsAll
                : gridSessionsAll.filter((s) => s.day === currentFilter);
            document.getElementById("agendaGrid").innerHTML = list
              .map((s) => sessionCardHtml(s, currentFilter === "all", true))
              .join("");
          }

          function setupTabs() {
            document.querySelectorAll(".tab").forEach((btn) => {
              btn.addEventListener("click", () => {
                if (eventOver) return;
                currentFilter = btn.dataset.day;
                document
                  .querySelectorAll(".tab")
                  .forEach((b) => b.classList.toggle("active", b === btn));
                renderGrid();
              });
            });
          }

          function renderAgenda() {
            // ?now=2026-09-23T15:00:00 lets you preview live/next/past behavior without
            // waiting for the real event dates — otherwise this uses the real clock.
            // (Or use the debug panel's date simulator, which takes priority.)
            const now = resolveNow();

            const withDates = SESSIONS.map((s, i) => ({
              ...s,
              id: i,
              startDate: new Date(`${s.date}T${s.start}:00`),
              endDate: new Date(`${s.date}T${s.end}:00`),
            })).sort((a, b) => a.startDate - b.startDate);

            const past = withDates.filter((s) => s.endDate <= now);
            const upcoming = withDates.filter((s) => s.endDate > now);
            const featured = upcoming[0];
            eventOver = upcoming.length === 0 && past.length > 0;
            gridSessionsAll = eventOver ? past : upcoming;
            featuredId = featured ? featured.id : null;
            featuredIsLive = featured ? now >= featured.startDate : false;

            // Auto-select today's day tab, if today is one of the event days.
            const pad = (n) => String(n).padStart(2, "0");
            const todayKey = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
            const dateToDay = {};
            SESSIONS.forEach((s) => {
              dateToDay[s.date] = s.day;
            });
            currentFilter = dateToDay[todayKey] || "all";
            document.querySelectorAll(".tab").forEach((b) => {
              b.classList.toggle("active", b.dataset.day === currentFilter);
              b.disabled = eventOver;
            });
            document
              .getElementById("dayTabs")
              .classList.toggle("disabled", eventOver);

            const featSubHeader = document.getElementById("featSubHeader");
            if (featured) {
              featSubHeader.hidden = false;
              featSubHeader.textContent = featuredIsLive
                ? "Happening Now"
                : "Up Next";
            } else {
              featSubHeader.hidden = true;
            }
            document.getElementById("featSlot").innerHTML = featured
              ? sessionCardHtml(featured, true)
              : "";
            renderGrid();

            // Once the event is over, past sessions live in the main grid above
            // instead of a separate "Past Sessions" section.
            const pastSection = document.getElementById("pastSection");
            if (!eventOver && past.length) {
              pastSection.hidden = false;
              document.getElementById("pastGrid").innerHTML = past
                .map(pastCardHtml)
                .join("");
            } else {
              pastSection.hidden = true;
            }
          }

          function escAttr(str) {
            const el = document.createElement("span");
            el.textContent = str;
            return el.innerHTML;
          }

          function escHtml(str) {
            if (!str) return "";
            const el = document.createElement("span");
            el.textContent = str;
            return el.innerHTML;
          }

          function isSafeUrl(url) {
            if (!url) return false;
            try {
              const parsed = new URL(url, window.location.origin);
              return ["http:", "https:", "mailto:"].includes(parsed.protocol);
            } catch (e) {
              return false;
            }
          }

          function renderExplore() {
            document.getElementById("exploreGrid").innerHTML = RESOURCES.map(
              (r) => {
                const safeUrl = isSafeUrl(r.url) ? escAttr(r.url) : '#';
                const externalAttrs = isSafeUrl(r.url) ? ' target="_blank" rel="noopener"' : '';
                const iconHtml = r.icon ? `<img src="${escAttr(r.icon)}" alt="">` : CHAT_ICON_SVG;
                return `
        <a href="${safeUrl}" class="res-card"${externalAttrs}>
          <div class="icn">${iconHtml}</div>
          <div class="r-text"><h3>${escAttr(r.title)}</h3><p>${escAttr(r.desc)}</p></div>
        </a>`;
              },
            ).join("");
          }

          function renderSocials() {
            document.getElementById("socialBand").innerHTML = SOCIALS.map(
              (s) => {
                const safeUrl = isSafeUrl(s.url) ? escAttr(s.url) : '#';
                return `
        <a href="${safeUrl}" class="social-link" target="_blank" rel="noopener" aria-label="${escAttr(s.name)}">
          ${SOCIAL_ICONS[s.name] || ""}
        </a>`;
              },
            ).join("");
          }

          

          setupTabs();
          renderAgenda();
          renderExplore();
          renderSocials();
          
    </script>
  </body>
</html>
